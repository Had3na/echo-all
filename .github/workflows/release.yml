name: Build signed release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Configure release
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_ANDROID: ${{ secrets.FIREBASE_ANDROID_JSON }}
        run: node scripts/configure-release.mjs
      - run: npm ci --prefix notes && npm run vendor --prefix notes
      - run: chmod +x gradlew && ./gradlew :app:assembleRelease :app:testDebugUnitTest
      - run: node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Android-release
          path: |
            app/build/outputs/apk/release/*.apk
            release/version.json
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Firebase
        env:
          FIREBASE_WEB: ${{ secrets.FIREBASE_WEB_JSON }}
        run: node scripts/configure-web.mjs
      - run: npm ci --prefix notes && npm run vendor --prefix notes
      - run: npm ci --prefix pc-app
      - run: npm test --prefix pc-app
      - run: npm run dist --prefix pc-app
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-release
          path: pc-app/dist/*Setup.exe
  draft:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./pc-app/package.json').version")
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "Echo-All $VERSION" --notes-file RELEASE-0.25.md
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' -o -name 'version.json' \) -exec gh release upload "v$VERSION" {} +
