name: Verify Echo-All
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci --prefix notes && npm run vendor --prefix notes
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix notes && npm run vendor --prefix notes
      - run: npm ci --prefix pc-app
      - run: npm test --prefix pc-app
      - run: npm run dist --prefix pc-app
      - uses: actions/upload-artifact@v4
        with:
          name: Echo-All-PC
          path: pc-app/dist/*Setup.exe
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix firebase
      - run: npm test --prefix firebase
